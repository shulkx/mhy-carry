[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]
exclude = ["spikes"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/shulkx/mhy-carry"
publish = false

[workspace.dependencies]
mhy-carry-core = { path = "crates/core" }
mhy-carry-api = { path = "crates/api" }
mhy-carry-platform = { path = "crates/platform" }
mhy-carry-runner = { path = "crates/runner" }
mhy-carry-live = { path = "crates/live" }

base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
# 只解码截图常见的 PNG 和 JPEG。
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
jiff = { version = "0.2", features = ["serde"] }
proptest = "1.12"
qrcode = { version = "0.14", default-features = false }
reqwest = "0.13"
# 只开二维码识别。默认功能会带进 imageproc 和全部图片格式，依赖多出一大截，
# 其中 paste、ttf-parser 已无人维护，过不了 cargo-deny。图片由我们自己解码成灰度后交给它。
rxing = { version = "0.9", default-features = false, features = ["decoders", "qrcode", "multi_barcode_readers", "encoding_rs"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2.12"
tauri-build = "2.7"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
xcap = "0.9.8"
