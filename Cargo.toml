[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/shulkx/mhy-carry"
publish = false

[workspace.dependencies]
mhy-carry-core = { path = "crates/core" }
mhy-carry-api = { path = "crates/api" }
mhy-carry-platform = { path = "crates/platform" }

clap = { version = "4.6", features = ["derive"] }
dirs = "7"
jiff = { version = "0.2", features = ["serde"] }
proptest = "1.12"
qrcode = { version = "0.14", default-features = false }
reqwest = "0.13"
rxing = "0.9"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6"
